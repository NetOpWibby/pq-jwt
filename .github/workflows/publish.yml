name: Publish

on:
  push:
    branches:
      - primary

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/checkout@v6
      - name: Publish package
        run: deno publish
